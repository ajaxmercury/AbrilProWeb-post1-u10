spring.application.name=catalogo-productos
server.port=8080

# Configuracion de base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:catalogodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Consola H2 para inspeccion en desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
