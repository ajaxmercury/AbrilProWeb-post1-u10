name: CI — Compilacion, Pruebas y Cobertura JaCoCo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Compilar, ejecutar pruebas y verificar cobertura JaCoCo
        run: mvn -B -f catalogo-productos/pom.xml clean verify --no-transfer-progress
